  <style>
    *{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%}body{overflow:hidden;background:#061d35;color:#f4f8fb;font-family:"Noto Serif SC","Songti SC","SimSun",serif}.gateway{isolation:isolate;width:100vw;height:100svh;min-height:620px;position:relative;overflow:hidden;background:radial-gradient(circle at 70% 12%,rgba(42,128,177,.3),transparent 30%),radial-gradient(circle at 15% 80%,rgba(10,96,148,.22),transparent 30%),linear-gradient(135deg,#04192f 0%,#082c4c 48%,#07345a 72%,#051d37 100%)}.gateway:before{content:"";position:absolute;inset:0;z-index:-4;background:linear-gradient(90deg,rgba(1,13,26,.7),transparent 52%),repeating-linear-gradient(115deg,rgba(203,235,255,.02) 0 1px,transparent 1px 9px)}.grain{position:absolute;inset:0;z-index:20;pointer-events:none;opacity:.14;mix-blend-mode:screen;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.15'/%3E%3C/svg%3E")}.project-logo{position:absolute;z-index:15;top:5.2%;left:4.9%;display:flex;align-items:center;gap:22px;color:#f4f4ef;animation:1.1s .15s both fadeDown}.logo-seal{display:grid;place-items:center;width:64px;height:64px;border:3px solid #ad493c;color:#d37164;font-size:16px;line-height:1.12;letter-spacing:2px;transform:rotate(-1.4deg)}.project-logo b{display:block;font-size:28px;font-weight:400;line-height:1.1;letter-spacing:3px;white-space:nowrap}.project-logo small{display:block;margin-top:9px;color:rgba(221,235,242,.62);font:12px/1.2 Arial,sans-serif;letter-spacing:1.4px;white-space:nowrap}.hero-copy{position:absolute;z-index:12;top:24%;left:7.5%}.hero-copy>p{margin:0 0 22px;color:#78c7e8;font:11px/1 Arial,sans-serif;letter-spacing:6px;animation:1s .4s both reveal}.hero-copy h1{display:flex;align-items:baseline;gap:.15em;margin:0;color:#f4f8fa;font-size:clamp(48px,5.8vw,94px);font-weight:400;line-height:1.1;letter-spacing:.045em;white-space:nowrap;text-shadow:0 14px 40px rgba(0,7,17,.32);animation:1.25s .75s both reveal}.hero-copy h1 em{color:#a9def1;font-style:normal}.hero-note{display:flex;align-items:center;gap:16px;margin-top:28px;color:rgba(224,239,246,.67);font-size:13px;line-height:1.9;letter-spacing:1.8px;animation:1.1s 1.1s both reveal}.hero-note>i{width:44px;height:1px;background:#61add0}.river-wrap{position:absolute;inset:0;z-index:2}.river{width:100%;height:100%;overflow:visible}.river path{fill:none;stroke-linecap:round;stroke-dasharray:2500;stroke-dashoffset:2500}.river-depth{stroke:#031326;stroke-width:146px;opacity:.82;filter:blur(5px);animation:9s linear .7s forwards draw}.river-body{stroke:url(#water);stroke-width:112px;opacity:.78;filter:drop-shadow(0 0 24px rgba(38,169,217,.28));animation:9s linear .7s forwards draw}.water-glow{stroke:url(#waterGlow);stroke-width:9px;opacity:.62;animation:9s linear .7s forwards draw,3.8s ease-in-out 4s infinite waterPulse}.glow-two{stroke-width:3px;opacity:.34;animation-delay:.7s,5s}.ripple{stroke:#d6f7ff;stroke-width:2px;opacity:0;stroke-dasharray:16 22!important;animation:4s linear 3s infinite rippleFlow!important}.ripple-two{animation-delay:4s!important}.ripple-three{animation-delay:5s!important}.event-layer{position:absolute;inset:0;z-index:8;pointer-events:none}.water-event{position:absolute;display:flex;align-items:center;gap:9px;opacity:0;white-space:nowrap;transform:translate(-50%,-50%) scale(.88);animation:.8s ease-out forwards eventAppear}.event-ring{display:grid;place-items:center;width:21px;height:21px;border:1px solid rgba(205,246,255,.72);border-radius:50%;box-shadow:0 0 0 7px rgba(77,185,220,.1),0 0 24px rgba(138,228,247,.62)}.event-ring i{width:7px;height:7px;border-radius:50%;background:#d6f8ff;box-shadow:0 0 10px #d7f9ff}.water-event div{display:flex;flex-direction:column;gap:4px;padding:6px 9px;border-radius:4px;background:linear-gradient(90deg,rgba(5,34,60,.68),transparent);text-shadow:0 3px 14px #061e36}.water-event strong{color:#effaff;font:500 22px/1 Georgia,serif;letter-spacing:2px}.water-event small{color:rgba(221,240,247,.72);font-size:10px;letter-spacing:2px}.enter-site{position:absolute;z-index:25;bottom:6.5%;left:50%;display:flex;align-items:center;gap:34px;padding:5px 5px 5px 28px;border:1px solid rgba(187,226,242,.52);border-radius:40px;background:rgba(7,43,73,.56);color:#fff;font-size:13px;letter-spacing:4px;text-decoration:none;backdrop-filter:blur(12px);opacity:0;transform:translate(-50%,18px);transition:.3s;animation:1s 2.8s forwards buttonIn}.enter-site b{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,#d7f7fb,#85cce3);color:#073251;font:22px/1 Arial,sans-serif;transition:.3s}.enter-site:hover,.enter-site:focus-visible{background:rgba(26,102,143,.62);border-color:#d9f7ff;box-shadow:0 10px 35px rgba(21,132,180,.3);outline:none}.enter-site:hover b,.enter-site:focus-visible b{transform:translateX(3px)}.bottom-caption{position:absolute;z-index:12;right:4.5%;bottom:3.4%;margin:0;color:rgba(201,224,235,.27);font:8px/1 Arial,sans-serif;letter-spacing:3px}.atmosphere{position:absolute;z-index:-2;border-radius:50%;background:rgba(41,147,196,.12);filter:blur(65px);animation:9s ease-in-out infinite alternate drift}.atmosphere-one{width:46vw;height:20vw;top:5%;right:-8%}.atmosphere-two{width:55vw;height:21vw;bottom:-8%;left:15%;animation-delay:-4s}
    @keyframes draw{to{stroke-dashoffset:0}}@keyframes reveal{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}@keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}@keyframes eventAppear{0%{opacity:0;transform:translate(-50%,-50%) scale(.88)}60%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes buttonIn{to{opacity:1;transform:translate(-50%,0)}}@keyframes waterPulse{50%{opacity:.22;stroke-width:5px}}@keyframes rippleFlow{0%{opacity:0;stroke-dashoffset:100px}25%,75%{opacity:.48}to{opacity:0;stroke-dashoffset:-160px}}@keyframes drift{to{transform:translate(7vw,2vw)}}
    @media(max-width:800px){.gateway{min-height:620px}.project-logo{top:4%;left:6%;gap:13px}.logo-seal{width:48px;height:48px;border-width:2px;font-size:12px}.project-logo b{font-size:16px;letter-spacing:1.5px}.project-logo small{max-width:260px;font-size:7px;letter-spacing:.5px}.hero-copy{top:20%;left:5%}.hero-copy>p{font-size:8px;letter-spacing:2.5px}.hero-copy h1{width:90vw;max-width:none;gap:.08em;font-size:clamp(29px,8.2vw,60px);letter-spacing:.01em}.hero-note{font-size:10px;letter-spacing:1px}.hero-note>i{display:none}.river{width:145%;margin-left:-20%}.water-event small{display:none}.water-event strong{font-size:15px}.water-event:nth-child(4),.water-event:nth-child(5){display:none}.enter-site{bottom:8%}.bottom-caption{display:none}}
    @media(prefers-reduced-motion:reduce){*,:before,:after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-delay:0s!important}}

<body>
  <main class="gateway">
    <header class="project-logo" aria-label="南水往事记忆空间"><span class="logo-seal">南水<br>往事</span><div><b>南水往事记忆空间</b><small>MEMORY OF THE SOUTH–NORTH WATER DIVERSION</small></div></header>
    <section class="hero-copy"><p>1952 — 1979 · THE RIVER OF TIME</p><h1><span>一渠清水，</span><em>穿越岁月</em></h1><div class="hero-note"><i></i><span>循着水流的方向，回望南水北调早期中线工程<br>从宏伟构想到持续探索的历史足迹</span></div></section>
    <div class="river-wrap" aria-hidden="true"><svg class="river" viewBox="0 0 1600 900" preserveAspectRatio="none"><defs><linearGradient id="water" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0a5a89"/><stop offset=".42" stop-color="#1488bd"/><stop offset=".72" stop-color="#36b8dc"/><stop offset="1" stop-color="#92e1ee"/></linearGradient><linearGradient id="waterGlow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#62cbe0" stop-opacity=".15"/><stop offset=".55" stop-color="#c4f7ff" stop-opacity=".7"/><stop offset="1" stop-color="#ecfdff" stop-opacity=".9"/></linearGradient><filter id="waterTexture" x="-20%" y="-30%" width="140%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.008 0.035" numOctaves="2" seed="8" result="noise"><animate attributeName="baseFrequency" values="0.008 0.035;0.012 0.045;0.008 0.035" dur="7s" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" in2="noise" scale="26" xChannelSelector="R" yChannelSelector="B"/><feGaussianBlur stdDeviation="0.6"/></filter></defs><path class="river-depth" d="M-130 725 C170 565 350 770 605 650 C850 535 920 455 1165 540 C1390 618 1490 480 1710 225"/><path class="river-body" filter="url(#waterTexture)" d="M-130 725 C170 565 350 770 605 650 C850 535 920 455 1165 540 C1390 618 1490 480 1710 225"/><path class="water-glow glow-one" d="M-120 700 C175 595 355 740 615 622 C845 518 935 484 1160 558 C1390 635 1500 450 1705 205"/><path class="water-glow glow-two" d="M-100 746 C180 620 355 785 625 669 C840 576 935 505 1170 575 C1390 642 1510 505 1720 255"/><path class="ripple ripple-one" d="M55 678 C180 635 275 672 400 694"/><path class="ripple ripple-two" d="M670 623 C820 563 935 515 1080 548"/><path class="ripple ripple-three" d="M1250 569 C1395 593 1505 448 1610 322"/></svg></div>
